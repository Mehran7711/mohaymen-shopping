deploymentName: payment-service
serviceName: payment-service
appLabel: payment-service

replicaCount: 1

image:
  repository: payment-service
  tag: "2.0"

containerPort: 8082

service:
  type: ClusterIP
  port: 8082

kafka:
  enabled: true
database:
  enabled: true
  username: PAYMENT

resources:
  requests:
    cpu: 250m
    memory: 384Mi
  limits:
    cpu: "1"
    memory: 700Mi

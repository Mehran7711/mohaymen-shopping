deploymentName: notification-service
serviceName: notification-service
appLabel: notification-service

replicaCount: 1

image:
  repository: notification-service
  tag: "2.0"

containerPort: 8084

service:
  type: ClusterIP
  port: 8084

redis:
  enabled: true
kafka:
  enabled: true
database:
  enabled: true
  username: NOTIFICATION
mail:
  enabled: true

resources:
  requests:
    cpu: 250m
    memory: 384Mi
  limits:
    cpu: "1"
    memory: 700Mi

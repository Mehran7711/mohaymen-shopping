services:
  store-db:
    image: gvenzl/oracle-xe
    container_name: store-db
    ports:
      - "1521:1521"
      - "5500:5500"
    environment:
      ORACLE_PASSWORD: 123
      ORACLE_DATABASE: XE
      # Add these for better initialization:
      ORACLE_ENABLE_XDB: 1
      ORACLE_ALLOW_REMOTE: true
    volumes:
      - oracle-data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD-SHELL", "sqlplus -s ADMIN/123@XE <<< 'select 1 from dual;'"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s

volumes:
  oracle-data:
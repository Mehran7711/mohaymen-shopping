name: 'mohaymen-shopping'
services:

  store-db:
    image: gvenzl/oracle-xe
    container_name: store-db
    ports:
      - "1521:1521"
      - "5500:5500"
    environment:
      ORACLE_PASSWORD: oracle
    volumes:
      - oracle-data:/opt/oracle/oradata
      - ./db/init:/container-entrypoint-initdb.d
    healthcheck:
      test: [ "CMD-SHELL", "sqlplus -s system/oracle@//localhost:1521/XEPDB1 <<< 'SELECT 1 FROM DUAL;' || exit 1" ]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 120s


  api-gateway:
    build:
      context: ../..
      dockerfile: api-gateway/Dockerfile
    image: api-gateway:2.0
    container_name: api-gateway
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - STORE_SERVICE_URL=http://store-service:8081
      - PAYMENT_SERVICE_URL=http://payment-service:8082
    ports:
      - "8989:8989"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 700m

  store-service:
    build:
      context: ../..
      dockerfile: store-service/Dockerfile
    image: store-service:2.0
    container_name: store-service
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - STORE_PAYMENT_SERVICE_URL=http://api-gateway:8989/payment
      - DB_URL=jdbc:oracle:thin:@//store-db:1521/XE
      - DB_USERNAME=STORE
      - DB_PASSWORD=123
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    ports:
      - "8081:8081"
    restart: unless-stopped
    depends_on:
      store-db:
        condition: service_healthy
      redis:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 700m

  payment-service:
    build:
      context: ../..
      dockerfile: payment-service/Dockerfile
    image: payment-service:2.0
    container_name: payment-service
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - DB_URL=jdbc:oracle:thin:@//store-db:1521/XE
      - DB_USERNAME=PAYMENT
      - DB_PASSWORD=123
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    ports:
      - "8082:8082"
    restart: unless-stopped
    depends_on:
      store-db:
        condition: service_healthy
      redis:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 700m

  zookeeper:
    image: docker.arvancloud.ir/confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  Kafka:
    image: docker.arvancloud.ir/confluentinc/cp-kafka:7.5.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://Kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  redis:
    image: docker.arvancloud.ir/redis:7-alpine
    container_name: redis-cache
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]  # No password needed
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  redisinsight:
    image: docker.arvancloud.ir/redis/redisinsight:latest
    container_name: redisinsight
    ports:
      - "5540:5540"
    restart: unless-stopped
    depends_on:
      - redis

  kafdrop:
    image: docker.arvancloud.ir/obsidiandynamics/kafdrop:latest
    container_name: kafdrop
    restart: unless-stopped
    ports:
      - "9000:9000"
    environment:
      KAFKA_BROKERCONNECT: Kafka:9092
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"



volumes:
  oracle-data:
  redis-data:


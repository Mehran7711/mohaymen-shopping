name: 'mohaymen-shopping'
services:

  store-db:
    image: gvenzl/oracle-xe
    container_name: store-db
    ports:
      - "1521:1521"
      - "5500:5500"
    environment:
      ORACLE_PASSWORD: oracle
    volumes:
      - oracle-data:/opt/oracle/oradata
      - ./db/init:/container-entrypoint-initdb.d
    healthcheck:
      test: [ "CMD-SHELL", "sqlplus -s system/oracle@//localhost:1521/XEPDB1 <<< 'SELECT 1 FROM DUAL;' || exit 1" ]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 120s


  api-gateway:
    build:
      context: ../..
      dockerfile: api-gateway/Dockerfile
    image: api-gateway:2.0
    container_name: api-gateway
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - STORE_SERVICE_URL=http://store-service:8081
      - PAYMENT_SERVICE_URL=http://payment-service:8082
      - WEBAPP_SERVICE_URL=http://store-webapp:8080
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SPRING_CONFIG_ADDITIONAL_LOCATION=optional:file:/config/application.yaml
    ports:
      - "8989:8989"
    volumes:
      - ../../api-gateway/src/main/resources/application.yaml:/config/application.yaml:ro
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 700m

  store-service:
    build:
      context: ../..
      dockerfile: store-service/Dockerfile
    image: store-service:2.0
    container_name: store-service
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - STORE_PAYMENT_SERVICE_URL=http://api-gateway:8989/payment
      - KEYCLOAK_ADMIN_URL=http://keycloak:9191
      - DB_URL=jdbc:oracle:thin:@//store-db:1521/XE
      - DB_USERNAME=STORE
      - DB_PASSWORD=123
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - oauth2.server_url=http://keycloak:9191
      - oauth2.browser_url=http://localhost:9192
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI=http://localhost:9192/realms/store
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI=http://keycloak:9191/realms/store/protocol/openid-connect/certs
    ports:
      - "8081:8081"
    restart: unless-stopped
    depends_on:
      store-db:
        condition: service_healthy
      redis:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 700m

  payment-service:
    build:
      context: ../..
      dockerfile: payment-service/Dockerfile
    image: payment-service:2.0
    container_name: payment-service
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - DB_URL=jdbc:oracle:thin:@//store-db:1521/XE
      - DB_USERNAME=PAYMENT
      - DB_PASSWORD=123
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    ports:
      - "8082:8082"
    restart: unless-stopped
    depends_on:
      store-db:
        condition: service_healthy
      redis:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 700m

  store-webapp:
    build:
      context: ../..
      dockerfile: store-webapp/Dockerfile
    image: store-webapp:2.0
    container_name: store-webapp
    environment:
      - GATEWAY_URL=http://api-gateway:8989
      - OAUTH2_SERVER_URL=http://keycloak:9191
      - OAUTH2_BROWSER_URL=http://localhost:9192
      - SERVER_FORWARD_HEADERS_STRATEGY=framework
    restart: unless-stopped
    depends_on:
      - api-gateway
      - keycloak
    deploy:
      resources:
        limits:
          memory: 700m

  notification-service:
    build:
      context: ../..
      dockerfile: notification-service/Dockerfile
    image: notification-service:2.0
    container_name: notification-service
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - DB_URL=jdbc:oracle:thin:@//store-db:1521/XE
      - DB_USERNAME=NOTIFICATION
      - DB_PASSWORD=123
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MAIL_HOST=mailhog
      - MAIL_PORT=1025
    ports:
      - "8084:8084"
    restart: unless-stopped
    depends_on:
      store-db:
        condition: service_healthy
      redis:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 700m

  zookeeper:
    image: docker.arvancloud.ir/confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  Kafka:
    image: docker.arvancloud.ir/confluentinc/cp-kafka:7.5.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://Kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  redis:
    image: docker.arvancloud.ir/redis:7-alpine
    container_name: redis-cache
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]  # No password needed
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  keycloak:
    build:
      context: ./
      dockerfile: keycloak/Dockerfile
    image: keycloak-oracle
    container_name: keycloak
    ports:
      - "9192:9191"
    environment:
      KC_DB: oracle
      KC_DB_URL: jdbc:oracle:thin:@//store-db:1521/XE
      KC_DB_USERNAME: KEYCLOAK
      KC_DB_PASSWORD: 123
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin123
      KC_HOSTNAME: http://localhost:9192
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
    depends_on:
      store-db:
        condition: service_healthy
#    command: [ 'start-dev', '--import-realm',  '--http-port=9191' ]
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ./keycloak:/opt/keycloak/data/import
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2gb

  redisinsight:
    image: docker.arvancloud.ir/redis/redisinsight:latest
    container_name: redisinsight
    ports:
      - "5540:5540"
    restart: unless-stopped
    depends_on:
      - redis

  kafdrop:
    image: docker.arvancloud.ir/obsidiandynamics/kafdrop:latest
    container_name: kafdrop
    restart: unless-stopped
    ports:
      - "9000:9000"
    environment:
      KAFKA_BROKERCONNECT: Kafka:9092
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  mailhog:
    image: docker.arvancloud.ir/mailhog/mailhog:v1.0.1
    container_name: mailhog
    ports:
      - "1025:1025"
      - "8025:8025"

  loki:
    image: docker.arvancloud.ir/grafana/loki:3.7.0
    container_name: loki
    command: -config.file=/etc/loki/config.yaml
    ports:
      - "3100:3100"
    volumes:
      - ./observability/loki-config.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/usr/bin/loki", "-health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  alloy:
    image: docker.arvancloud.ir/grafana/alloy:v1.21.2
    container_name: alloy
    user: "0:0"
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./observability/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - alloy-data:/var/lib/alloy/data
    depends_on:
      loki:
        condition: service_healthy
    restart: unless-stopped

  grafana:
    image: docker.arvancloud.ir/grafana/grafana:12.1.0
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: http://localhost:3000
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      loki:
        condition: service_healthy
    restart: unless-stopped


volumes:
  oracle-data:
  redis-data:
  keycloak-data:
  loki-data:
  grafana-data:
  alloy-data:


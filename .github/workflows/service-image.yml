name: Service image

on:
  push:
    paths:
      - api-gateway/**
      - store-service/**
      - payment-service/**
      - notification-service/**
      - store-webapp/**
      - store-events/**
      - pom.xml
      - .github/workflows/service-image.yml

permissions:
  contents: read
  packages: write

concurrency:
  group: service-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build changed services
        env:
          DOCKER_BUILDKIT: "1"
        run: |
          set -euo pipefail
          owner="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          services="api-gateway store-service payment-service notification-service store-webapp"
          if git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
            files="$(git diff --name-only HEAD~1 HEAD)"
          else
            files="$(git ls-tree -r --name-only HEAD)"
          fi

          selected=""
          if printf '%s\n' "${files}" | grep -Eq '^(pom\.xml$|store-events/|\.github/workflows/service-image\.yml$)'; then
            selected="${services}"
          else
            for service in ${services}; do
              if printf '%s\n' "${files}" | grep -q "^${service}/"; then
                selected="${selected} ${service}"
              fi
            done
          fi

          for service in ${selected}; do
            image="ghcr.io/${owner}/${service}"
            echo "Building ${image}:latest"
            docker build \
              --build-arg MAVEN_IMAGE=maven:3.9.11-eclipse-temurin-21 \
              -f "${service}/Dockerfile" \
              -t "${image}:latest" \
              .
            docker push "${image}:latest"
            echo "Pushed ${image}:latest. The chart keeps tag latest and does not commit values.yaml."
          done

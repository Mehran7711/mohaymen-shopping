spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${oauth2.issuer_url}
          jwk-set-uri: ${oauth2.server_url}/realms/store/protocol/openid-connect/certs
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms
  cache:
    type: redis
    redis:
      time-to-live: 600000  # 10 minutes (in milliseconds)
      cache-null-values: true
      use-key-prefix: true
      key-prefix: "myapp:"

  kafka:
    bootstrap-servers: Kafka:9092

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

    consumer:
      group-id: store-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"

  application:
    name: store-service
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    validate-on-migrate: false
    locations: classpath:db/migration
  datasource:
    url: ${DB_URL:jdbc:oracle:thin:@//localhost:1521/XE}
    username: ${DB_USERNAME:STORE}
    password: ${DB_PASSWORD:123}
    driver-class-name: oracle.jdbc.OracleDriver

oauth2:
  server_url: http://keycloak:9191
  browser_url: http://localhost:9192
  issuer_url: ${oauth2.browser_url}/realms/store

realm:
  url: ${oauth2.issuer_url}

swagger:
  api-gateway-url: http://api-gateway:8989/store


server:
  port: 8081
  shutdown: graceful


management:
  endpoints:
    web:
      exposure:
        include:
          - "*"
  info:
    git:
      mode: full

store:
  payment-service-url: ${STORE_PAYMENT_SERVICE_URL:http://api-gateway:8989/payment}
  keycloak-admin-url: ${KEYCLOAK_ADMIN_URL:http://localhost:9191}
  web:
    pageSize: 10

resilience4j:
  retry:
    backends:
      payment-service:
        max-attempts: 2
        wait-duration: 1s
  circuitbreaker:
    backends:
      payment-service:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 6
        minimum-number-of-calls: 4
        wait-duration-in-open-state: 20s
        permitted-number-of-calls-in-half-open-state: 2
        failure-rate-threshold: 50

logging:
  level:
    org.springframework.cache: DEBUG
    org.springframework.cache.interceptor: TRACE
    org.springframework.data.redis.cache: DEBUG
    com.mohaymen.store: DEBUG
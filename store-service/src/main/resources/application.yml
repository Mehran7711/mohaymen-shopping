spring:
  application:
    name: store-service
  flyway:
    enabled: true
    locations: classpath:db/migration
  datasource:
    url: ${DB_URL:jdbc:oracle:thin:@//localhost:1521/XE}
    username: ${DB_USERNAME:STORE}
    password: ${DB_PASSWORD:123}
    driver-class-name: oracle.jdbc.OracleDriver

server:
  port: 8081
  shutdown: graceful


management:
  endpoints:
    web:
      exposure:
        include:
          - "*"
  info:
    git:
      mode: full

store:
  web:
    pageSize: 10
  timeToLiveSeconds: 3600
  maxEntries: 100

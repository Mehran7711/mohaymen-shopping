<!DOCTYPE html>
<html lang="en"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}" xmlns:x-bind="http://www.w3.org/1999/xhtml">
<body>
<div layout:fragment="content">
    <div th:x-data="|initData('${orderNumber}')|">
        <h2>Your Order placed successfully</h2>
        <h4>Order Number: <span x-text="orderDetails.orderNumber">orderNumber</span></h4>
        <h4>Order Status: <span x-text="orderDetails.status">status</span></h4>
        <hr/>
        <div class="pb-3">
            <table class="table">
                <thead>
                <tr>
                    <th scope="col">Product Name</th>
                    <th scope="col">Price</th>
                    <th scope="col">Quantity</th>
                    <th scope="col">Sub Total</th>
                </tr>
                </thead>
                <tbody>
                <template x-for="item in orderDetails.items">
                    <tr>
                        <td x-text="item.productName">product</td>
                        <td x-text="item.unitPrice">price</td>
                        <td x-text="item.quantity">quantity</td>
                        <td x-text="item.totalPrice">SubTotal</td>
                    </tr>
                </template>
                </tbody>
                <tfoot>
                <tr>
                    <th colspan="3"></th>
                    <th colspan="1" style="text-align: left">
                        Total Amount: <span x-text="orderDetails.totalAmount">totalAmount</span>
                    </th>
                </tr>
                </tfoot>
            </table>

            <form class="row g-3" method="post">
                <div class="col-md-6">
                    <label for="customerName" class="form-label">Customer Name</label>
                    <input
                            id="customerName"
                            class="form-control"
                            type="text"
                            name="customerName"
                            readonly
                            x-bind:value="orderDetails.customer.firstName + ' ' + orderDetails.customer.lastName">
                </div>
                <div class="col-md-6">
                    <label for="customerEmail" class="form-label">Customer Email</label>
                    <input type="email" class="form-control"
                           id="customerEmail"
                           name="customerEmail"
                           readonly
                           x-model="orderDetails.customer.email">
                </div>
            </form>
        </div>
    </div>
</div>
<div layout:fragment="pageScripts">
    <script src="/js/orderDetails.js"></script>
</div>
</body>
</html>

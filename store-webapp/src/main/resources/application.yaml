spring:
  application:
    name: store-webapp

  security:
    oauth2:
      client:
        registration:
          store-webapp:
            client-id: store_client
            client-secret: G2OpSKR5OB0Amp0C0vHo2pNZSx3WgBycHKCJpLJgNgvfq1qo2v1NCcTPMUWNTv33ycak7aJREM3mZxRun7rp1y
            authorization-grant-type: authorization_code
            scope:
              - openid
              - profile
            redirect-uri: "{baseUrl}/login/oauth2/code/store-webapp"
        provider:
          store-webapp:
            authorization-uri: ${oauth2.browser_url}/realms/store/protocol/openid-connect/auth
            token-uri: ${oauth2.server_url}/realms/store/protocol/openid-connect/token
            jwk-set-uri: ${oauth2.server_url}/realms/store/protocol/openid-connect/certs
            user-info-uri: ${oauth2.server_url}/realms/store/protocol/openid-connect/userinfo
            user-name-attribute: preferred_username



oauth2:
  server_url: http://keycloak:9191
  browser_url: http://localhost:9192
  registrationId: "store-webapp"

realm:
  url: ${oauth2.server_url}/realms/store

gateway:
  url: http://localhost:8989
server:
  port: 8080

